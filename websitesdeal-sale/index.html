<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="ব্যবসার জন্য সুন্দর ওয়েবসাইট মাত্র ৪৯৯ টাকা মাসে।">
<title>Websitesdeal – ব্যবসার ওয়েবসাইট মাত্র ৪৯৯ টাকা/মাস</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--u:clamp(26px,min(9.2vw,5.4vh),88px);--bg:#0b0f1a;--ac:#c6ff3d;--c2:#2b50ff;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:#fff;font-family:'Hind Siliguri',system-ui,sans-serif;overflow:hidden}
.stage{position:fixed;inset:0;overflow:hidden}
.orb{position:absolute;width:90vmax;height:90vmax;border-radius:50%;left:50%;top:50%}
.o1{background:radial-gradient(circle,color-mix(in srgb,var(--c2) 38%,transparent),transparent 65%);animation:o1 16s ease-in-out infinite alternate}
.o2{background:radial-gradient(circle,color-mix(in srgb,var(--ac) 30%,transparent),transparent 65%);animation:o2 20s ease-in-out infinite alternate}
.o3{background:radial-gradient(circle,color-mix(in srgb,var(--c2) 38%,transparent),transparent 65%);animation:o3 24s ease-in-out infinite alternate}
@keyframes o1{from{transform:translate(-85%,-75%)}to{transform:translate(-25%,-25%)}}
@keyframes o2{from{transform:translate(-30%,-80%)}to{transform:translate(-75%,-20%)}}
@keyframes o3{from{transform:translate(-60%,-30%)}to{transform:translate(-20%,-70%)}}
.pers{position:absolute;inset:0;perspective:700px;overflow:hidden}
.grid{position:absolute;left:-60%;width:220%;bottom:-22vh;height:60vh;transform:rotateX(68deg);transform-origin:50% 100%;
 background-image:linear-gradient(color-mix(in srgb,var(--c2) 45%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--c2) 45%,transparent) 1px,transparent 1px);background-size:90px 90px;
 -webkit-mask-image:linear-gradient(to top,#000,transparent);mask-image:linear-gradient(to top,#000,transparent);animation:gm 2.4s linear infinite}
@keyframes gm{to{background-position:0 90px}}
.sp{position:absolute;bottom:-10px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;opacity:0;animation:sp linear infinite}
@keyframes sp{0%{transform:translateY(0);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(-110vh);opacity:0}}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.6) 100%)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");animation:gr .6s steps(4) infinite}
@keyframes gr{to{background-position:90px 60px}}
.wipe{position:absolute;top:-10%;bottom:-10%;left:0;width:50vw;transform:translateX(-60vw) skewX(-18deg);background:linear-gradient(90deg,transparent,var(--ac),transparent);opacity:.5;filter:blur(10px);pointer-events:none}
.wipe.go{animation:wp .75s ease-in forwards}
@keyframes wp{to{transform:translateX(130vw) skewX(-18deg)}}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*.4);padding:0 6vw;text-align:center;opacity:0;visibility:hidden;transition:opacity .5s;pointer-events:none}
.sc.on{opacity:1;visibility:visible;animation:dolly 7s linear forwards}
@keyframes dolly{to{transform:scale(1.07)}}
.hook{display:flex;flex-wrap:wrap;justify-content:center;gap:0 calc(var(--u)*.28);font-size:calc(var(--u)*1.15);font-weight:700;line-height:1.3}
.w{display:inline-block;opacity:0}
.on .w{animation:wi .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(var(--i)*.11s + .15s)}
@keyframes wi{from{opacity:0;transform:translateY(.8em) rotate(4deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.w.acc{background:linear-gradient(90deg,var(--ac),#fff,var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.on .w.acc{animation:wi .7s cubic-bezier(.16,1,.3,1) forwards,gs 2s linear infinite,sh .35s 1.4s ease-in-out 4;animation-delay:calc(var(--i)*.11s + .15s),0s,1.4s}
@keyframes gs{to{background-position:-200% 0}}
@keyframes sh{50%{transform:translateX(.04em)}}
.l{overflow:hidden;padding:.18em 0;font-weight:700;line-height:1.25}
.l>span{display:block;transform:translateY(115%);opacity:0}
.on .l>span{animation:li .85s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,.1s)}
@keyframes li{to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--u)*.2)}
.chip{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.25);padding:.35em .85em;border-radius:999px;font-size:calc(var(--u)*.42);font-weight:500;white-space:nowrap;opacity:0}
.on .chip{animation:ci .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d)}
@keyframes ci{from{opacity:0;transform:translateY(1em) scale(.9)}to{opacity:1;transform:none}}
.chip::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 2.6s linear infinite}
@keyframes shine{to{left:140%}}
.bwrap{position:relative}
.b3d{perspective:1500px}
.bx{width:min(82vw,70vh*1.2,900px);aspect-ratio:1/.72;border-radius:1.6vmin;overflow:hidden;background:#fff;box-shadow:0 5vmin 12vmin rgba(0,0,0,.6),0 0 14vmin color-mix(in srgb,var(--c2) 55%,transparent);opacity:0}
.on .bx{animation:bin .9s cubic-bezier(.16,1,.3,1) .35s forwards,b3 7s ease-in-out 1.2s infinite alternate}
@keyframes bin{from{opacity:0;transform:translateY(8vmin) rotateX(14deg)}to{opacity:1;transform:rotateX(4deg)}}
@keyframes b3{from{transform:rotateX(4deg) rotateY(-9deg) translateY(0)}to{transform:rotateX(2deg) rotateY(9deg) translateY(-1.2vmin)}}
.bar{height:7%;background:#e5e7eb;display:flex;align-items:center;gap:.8vmin;padding:0 1.6vmin;font-size:1.5vmin;color:#888}
.fgm .bar{background:#2b2b33}
.bar i{width:1.1vmin;height:1.1vmin;border-radius:50%}
.bar b{margin-left:1.4vmin;background:#fff;border-radius:99px;padding:.3vmin 1.6vmin;font-weight:400}
.fgm .bar b{background:#3a3a44}
.vp{position:relative;height:93%;overflow:hidden}
.fgm{background:#1e1e24}
.sk{animation:scr 4s cubic-bezier(.65,0,.35,1) 1.3s forwards}
@keyframes scr{to{transform:translateY(-34%)}}
.sk .h1{height:44%;background:linear-gradient(135deg,var(--c2),var(--ac));padding:5%}
.sk .h1 i{display:block;height:3.4vmin;border-radius:99px;background:rgba(255,255,255,.9);margin-bottom:1.6vmin;width:55%}
.sk .h1 i+i{width:38%;background:rgba(255,255,255,.6)}
.sk .h1 u{display:block;width:20%;height:4.6vmin;border-radius:99px;background:#0b0f1a;margin-top:3vmin}
.sk .cd{display:flex;gap:3%;padding:4%}
.sk .cd i{flex:1;height:18vmin;background:#eef0f6;border-radius:1.4vmin}
.sk .bg2{height:26vmin;margin:0 4%;background:#f4f5fa;border-radius:1.4vmin}
.cur{position:absolute;width:0;height:0;border-left:2.2vmin solid #fff;border-top:3.4vmin solid transparent;border-bottom:3.4vmin solid transparent;transform:rotate(-25deg);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));left:15%;top:75%;opacity:0}
.on .cur{animation:cu 4s ease-in-out 1.2s forwards}
@keyframes cu{0%{opacity:1;left:15%;top:75%}60%{opacity:1;left:62%;top:42%}100%{opacity:1;left:62%;top:42%}}
.rip{position:absolute;left:62%;top:42%;width:0;height:0;border:3px solid var(--ac);border-radius:50%;transform:translate(-50%,-50%);opacity:0}
.on .rip{animation:rp 1s ease-out 3.1s forwards}
@keyframes rp{0%{opacity:1;width:0;height:0}100%{opacity:0;width:16vmin;height:16vmin}}
.fr{position:absolute;border-radius:1.4vmin;opacity:0;outline:2px solid var(--ac);outline-offset:4px}
.on .fr{animation:fp .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d)}
@keyframes fp{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.fgm .cur{animation:cf 4s ease-in-out 1.2s forwards}
.on.fgm .cur,.on .fgm .cur{animation:cf 4s ease-in-out 1.2s forwards}
@keyframes cf{0%{opacity:1;left:10%;top:10%}35%{opacity:1;left:30%;top:25%}70%{opacity:1;left:60%;top:30%}100%{opacity:1;left:75%;top:55%}}
.toast{position:absolute;opacity:0;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.06));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.3);border-radius:1.6vmin;padding:1.2vmin 2vmin;font-size:calc(var(--u)*.34);white-space:nowrap;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.on .toast{animation:ti .8s cubic-bezier(.16,1,.3,1) forwards,fl 3s ease-in-out infinite alternate;animation-delay:var(--d),calc(var(--d) + .8s)}
.toast.r{right:-3vw}.toast.lf{left:-3vw}
@keyframes ti{from{opacity:0;transform:translateX(5em)}to{opacity:1;transform:none}}
.toast.lf{--s:-1}
@keyframes fl{to{margin-top:-.8vmin}}
.badge{background:var(--ac);color:#0b0f1a;font-weight:700;font-size:calc(var(--u)*.5);padding:.1em .9em;border-radius:999px;box-shadow:0 0 calc(var(--u)*.6) color-mix(in srgb,var(--ac) 60%,transparent);transform:scale(0)}
.on .badge{animation:po .6s cubic-bezier(.3,1.6,.5,1) .2s forwards}
@keyframes po{to{transform:scale(1)}}
.old{font-size:calc(var(--u)*.6);color:rgba(255,255,255,.6);text-decoration:line-through;opacity:0}
.on .old{animation:fd .6s .5s forwards}
@keyframes fd{to{opacity:1}}
.pw{position:relative;display:flex;justify-content:center;align-items:center}
.price{font-size:calc(var(--u)*2.1);font-weight:700;color:var(--ac);line-height:1.1;text-shadow:0 0 calc(var(--u)*.9) color-mix(in srgb,var(--ac) 60%,transparent);animation:gl 1.6s ease-in-out infinite alternate}
@keyframes gl{to{text-shadow:0 0 calc(var(--u)*1.4) color-mix(in srgb,var(--ac) 85%,transparent)}}
.ring{position:absolute;border:2px solid var(--ac);border-radius:50%;width:calc(var(--u)*4);height:calc(var(--u)*4);opacity:0}
.on .ring{animation:rg 2s ease-out infinite;animation-delay:var(--d)}
@keyframes rg{0%{transform:scale(.1);opacity:.6}100%{transform:scale(1);opacity:0}}
.suf{font-size:calc(var(--u)*.6);font-weight:500}
.note{font-size:calc(var(--u)*.38);color:rgba(255,255,255,.75);font-weight:500}
.btnw{position:relative;display:flex;justify-content:center;align-items:center;pointer-events:auto}
.btn{position:relative;overflow:hidden;display:inline-block;text-decoration:none;background:var(--ac);color:#0b0f1a;font-weight:700;font-size:calc(var(--u)*.62);padding:.28em .8em;border-radius:999px;box-shadow:0 0 calc(var(--u)*.9) color-mix(in srgb,var(--ac) 60%,transparent);opacity:0;pointer-events:auto}
.on .btn{animation:bi .7s cubic-bezier(.16,1,.3,1) .5s forwards,pu 1.1s ease-in-out 1.2s infinite}
@keyframes bi{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes pu{50%{transform:scale(1.05)}}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 1.8s linear infinite}
.pill{position:absolute;border:2px solid var(--ac);border-radius:999px;width:calc(var(--u)*3);height:calc(var(--u)*1.2);opacity:0}
.on .pill{animation:pl 1.8s ease-out infinite;animation-delay:var(--d)}
@keyframes pl{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2,1.9);opacity:0}}
.replay{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.prog{position:fixed;left:0;top:0;height:4px;background:var(--ac);width:0;z-index:5}
@media (prefers-reduced-motion:reduce){.grid,.orb,.sp,.grain{animation:none}}
</style></head><body>
<div class="stage" id="st">
 <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
 <div class="pers"><div class="grid"></div></div>
 <div id="sparks"></div>
 <div id="scs"></div>
 <div class="wipe" id="wipe"></div>
 <div class="vig"></div><div class="grain"></div>
</div>
<div class="prog" id="prog"></div>
<button class="replay" id="rp">↻ আবার চালান</button>
<script>
// === ফোন নম্বর: ইংরেজি সংখ্যায় (যেমন 01712345678)। ফাঁকা থাকলে বাটন কাজ করবে না ===
var PHONE='';
var B={"link": "", "scenes": [{"t": "hook", "d": 3.5, "text": "ব্যবসার ওয়েবসাইট নেই?", "accent": "নেই?"}, {"t": "mock", "d": 5.5, "title": "ক্লায়েন্ট এবার আপনাকে খুঁজে পাবে", "kind": "web", "url": "apnarbusiness.com", "toasts": ["🔔 নতুন অর্ডার এসেছে", "📩 নতুন মেসেজ"], "chips": ["✅ অ্যাপয়েন্টমেন্ট", "🛒 অনলাইন অর্ডার", "📱 মোবাইল-ফ্রেন্ডলি"]}, {"t": "offer", "d": 5.5, "badge": "মাত্র", "price": 499, "prefix": "৳", "suffix": "টাকা / মাস", "bullets": ["ফ্রি SSL", "দ্রুত লোড", "ডিজাইন বদলানো যায়"], "note": "ডোমেইন আপনি নিজে কিনবেন"}, {"t": "cta", "d": 6, "title": "আজই শুরু করুন", "button": "মেসেজ করুন", "sub": "Websitesdeal"}]};
var $=function(i){return document.getElementById(i)};
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function bn(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
function money(n){return bn(String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','))}
function words(t,acc){return '<div class="hook">'+t.split(' ').map(function(w,i){return '<span class="w'+(acc&&w.indexOf(acc)>-1?' acc':'')+'" style="--i:'+i+'">'+esc(w)+'</span>'}).join(' ')+'</div>'}
function line(t,d,sz,wt){return '<div class="l" style="font-size:calc(var(--u)*'+sz+');'+(wt?'font-weight:'+wt+';':'')+'--d:'+d+'s"><span>'+esc(t)+'</span></div>'}
function chips(a,d0,gap,pre){return '<div class="chips">'+a.map(function(t,i){return '<div class="chip" style="--d:'+(d0+i*gap).toFixed(2)+'s">'+(pre||'')+esc(t)+'</div>'}).join('')+'</div>'}
function mock(s){
  var fg=s.kind==='figma',body;
  if(fg){body='<div class="fr" style="left:8%;top:10%;width:36%;height:50%;background:var(--ac);--d:.8s"></div><div class="fr" style="left:52%;top:10%;width:40%;height:30%;background:var(--c2);--d:1s"></div><div class="fr" style="left:52%;top:46%;width:40%;height:30%;background:#fff;--d:1.2s"></div><div class="cur"></div>'}
  else{body='<div class="sk"><div class="h1"><i></i><i></i><u></u></div><div class="cd"><i></i><i></i><i></i></div><div class="bg2"></div></div><div class="cur"></div><div class="rip"></div>'}
  var toasts=(s.toasts||[]).map(function(t,i){return '<div class="toast '+(i%2?'lf':'r')+'" style="top:'+(10+i*32)+'%;--d:'+(2.2+i*.8).toFixed(1)+'s">'+esc(t)+'</div>'}).join('');
  return line(s.title,.1,.72)+'<div class="bwrap"><div class="b3d"><div class="bx '+(fg?'fgm':'')+'"><div class="bar"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i><b>'+esc(s.url)+'</b></div><div class="vp">'+body+'</div></div></div>'+toasts+'</div>'+chips(s.chips,1.8,.25)}
function offer(s){
  return '<div class="badge">'+esc(s.badge)+'</div>'+(s.old?'<div class="old">'+esc(s.old)+'</div>':'')+
   '<div class="pw"><span class="ring" style="--d:0s"></span><span class="ring" style="--d:.65s"></span><span class="ring" style="--d:1.3s"></span><div class="price" data-p="'+s.price+'">'+s.prefix+'০</div></div>'+
   (s.suffix?'<div class="suf">'+esc(s.suffix)+'</div>':'')+chips(s.bullets,1.5,.22,'✔ ')+(s.note?line(s.note,2.6,.38,500):'')}
function cta(s){
  return line(s.title,.1,1.05)+'<div class="btnw"><span class="pill" style="--d:0s"></span><span class="pill" style="--d:.9s"></span><a class="btn" id="cta" href="#">'+esc(s.button)+'</a></div>'+line(s.sub,1.1,.5,500)}
var VIEW={hook:function(s){return words(s.text,s.accent)},mock:mock,offer:offer,cta:cta};
var host=$('scs'),els=[];
B.scenes.forEach(function(s,i){var d=document.createElement('div');d.className='sc'+(s.kind==='figma'?' fg':'');d.innerHTML=VIEW[s.t](s);host.appendChild(d);els.push(d)});
if(/^01\d{9}$/.test(PHONE)){$('cta').href='https://wa.me/88'+PHONE}else if(B.link){$('cta').href=B.link}
// sparkles
(function(){var h='';for(var i=0;i<36;i++){var r=2+(i%4)*1.3;h+='<i class="sp" style="left:'+((i*37)%100)+'%;width:'+r+'px;height:'+r+'px;animation-duration:'+(7+(i%7))+'s;animation-delay:-'+((i*1.3)%9)+'s"></i>'}$('sparks').innerHTML=h})();
var timers=[],raf=0;
function counter(el,to){var t0=performance.now();(function f(n){var p=Math.min((n-t0)/1300,1),e=1-Math.pow(1-p,3);el.textContent=B.scenes.filter(function(x){return x.t==='offer'})[0].prefix+money(Math.round(to*e));if(p<1)raf=requestAnimationFrame(f)})(t0)}
function play(){
  timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
  els.forEach(function(e){e.classList.remove('on')});
  var total=B.scenes.reduce(function(a,s){return a+s.d},0)*1000,t=0,p=$('prog');
  p.style.transition='none';p.style.width='0';setTimeout(function(){p.style.transition='width '+total+'ms linear';p.style.width='100%'},40);
  B.scenes.forEach(function(s,i){timers.push(setTimeout(function(){
    els.forEach(function(e){e.classList.remove('on')});void els[i].offsetWidth;els[i].classList.add('on');
    var w=$('wipe');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');
    var pr=els[i].querySelector('.price');if(pr)timers.push(setTimeout(function(){counter(pr,+pr.dataset.p)},500));
  },t));t+=s.d*1000});
  timers.push(setTimeout(play,total+600));
}
$('rp').onclick=play;play();
</script></body></html>
